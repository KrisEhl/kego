[project]
name = "nineteenth-benchmark"
version = "0.1.0"
description = "Benchmark 19th's trained models against classical ML by training size"
requires-python = ">=3.13,<3.14"
dependencies = [
    "kego[tune]",
    "lightgbm>=4.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
]

[tool.uv.sources]
kego = { path = "../../..", editable = true }
